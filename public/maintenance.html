<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Meu Fiado · Em manutenção</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: #f8f8f5;
        color: #242424;
      }

      main {
        width: min(1440px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(24px, 5vw, 72px) clamp(20px, 5vw, 88px) 32px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 20px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: #ea4d3d;
        color: white;
        font-size: 14px;
        box-shadow: 0 8px 20px #ea4d3d3d;
      }

      .status {
        border: 1px solid #e4b7af;
        border-radius: 999px;
        background: #fff4f2;
        color: #b5392e;
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 750;
      }

      .content {
        display: grid;
        grid-template-columns: minmax(260px, 0.8fr) minmax(380px, 1.5fr);
        align-items: center;
        gap: clamp(28px, 6vw, 100px);
      }

      .message { max-width: 490px; }
      .eyebrow {
        margin: 0 0 14px;
        color: #c94a3c;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 5.2vw, 72px);
        line-height: .98;
        letter-spacing: -0.065em;
      }

      .message p:not(.eyebrow) {
        max-width: 420px;
        margin: 20px 0 0;
        color: #616161;
        font-size: clamp(16px, 1.45vw, 19px);
        line-height: 1.6;
      }

      .contact {
        display: inline-flex;
        align-items: center;
        margin-top: 28px;
        padding: 12px 16px;
        border-radius: 12px;
        background: #242424;
        color: white;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        transition: transform .2s ease, background .2s ease;
      }
      .contact:hover { transform: translateY(-2px); background: #ea4d3d; }

      .illustration { width: 100%; }
      .illustration svg { display: block; width: 100%; height: auto; }

      @media (max-width: 760px) {
        main { padding-top: 26px; }
        .content { grid-template-columns: 1fr; gap: 26px; }
        .message { text-align: center; margin: 0 auto; }
        .message p:not(.eyebrow) { margin-left: auto; margin-right: auto; }
        .illustration { order: -1; max-width: 650px; margin: 0 auto; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="topbar">
        <div class="brand"><span class="brand-mark">MF</span> Meu Fiado</div>
        <span class="status">EM MANUTENÇÃO</span>
      </header>

      <section class="content" aria-labelledby="maintenance-title">
        <div class="message">
          <p class="eyebrow">Estamos construindo algo melhor</p>
          <h1 id="maintenance-title">Voltamos em breve.</h1>
          <p>O Meu Fiado está passando por melhorias. Nossa equipe está preparando uma experiência ainda melhor para você.</p>
          <a class="contact" href="https://chat.whatsapp.com/GTc7DQBgrzqG1fmmHAcmPl">Entrar no grupo do WhatsApp</a>

          </svg>
        </div>
      </section>
    </main>
  </body>
</html>
