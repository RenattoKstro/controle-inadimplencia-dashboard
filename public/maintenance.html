<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site em Manutenção</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
      color: #333;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #d32f2f;
    }
    p {
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    .contact {
      font-size: 1em;
      color: #555;
    }
    .spinner {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #d32f2f;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Site em Manutenção</h1>
    <p>O SITE PODE SER BLOQUEADO EM BREVE.</p>
    <p class="contact">ENTRE NO GRUPO PARA FICAR POR DENTRO INFORMAÇÕES SOBRE O APP: <a href="https://chat.whatsapp.com/GTc7DQBgrzqG1fmmHAcmPl">Grupo WhatsApp</a>.</p>
  </div>
</body>
</html>
